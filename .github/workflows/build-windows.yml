name: Build Windows (Setup + Portable)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      signed_release:
        type: boolean
        default: false
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      WINDOWS_UPDATE_PUBLISHER:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.signed_release && vars.WINDOWS_SIGNING_CERTIFICATE_SHA1 != '' && fromJSON('["self-hosted", "Windows", "windows-signing"]') || 'windows-2022' }}
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Set version from tag
        if: inputs.signed_release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          npm pkg set version="$version"
        shell: pwsh

      - name: Build Electron app (Setup + Portable)
        if: '!inputs.signed_release'
        run: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Windows signing inputs
        if: inputs.signed_release
        run: node scripts/verify-win-release.cjs --preflight
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_UPDATE_PUBLISHER: ${{ secrets.WINDOWS_UPDATE_PUBLISHER }}
          WINDOWS_SIGNING_CERTIFICATE_SHA1: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_SHA1 }}

      - name: Build and verify signed Windows installers
        if: inputs.signed_release
        shell: pwsh
        run: |
          $signing = @('-c.forceCodeSigning=true', "-c.win.publisherName=$env:WINDOWS_UPDATE_PUBLISHER")
          if ($env:WINDOWS_SIGNING_CERTIFICATE_SHA1) {
            $signing += "-c.win.certificateSha1=$env:WINDOWS_SIGNING_CERTIFICATE_SHA1"
          }
          npm run build:win -- --publish never @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-win-release.cjs dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_UPDATE_PUBLISHER: ${{ secrets.WINDOWS_UPDATE_PUBLISHER }}
          WINDOWS_SIGNING_CERTIFICATE_SHA1: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_SHA1 }}

      - name: Verify update manifests and payload checksums
        run: node scripts/verify-update-metadata.cjs dist

      - name: Verify native update and restart on isolated installers
        if: '!inputs.signed_release'
        run: node scripts/test-windows-update.cjs

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-Setup
          path: dist/*Setup*.exe
          if-no-files-found: error

      - name: Upload Portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-Portable
          path: dist/*portable*.exe
          if-no-files-found: error

      - name: Upload Windows update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-win-update
          path: |
            dist/*Setup*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
