name: Build Linux (AppImage + RPM + DEB + Pacman + tar.gz)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing tag to rebuild as workflow artifacts (e.g. v1.11.0-gtrows.1).'
        required: false
        default: ''
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag && format('refs/tags/{0}', github.event.inputs.release_tag) || github.sha }}
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-gtrows\.[0-9]+$ ]]; then
              echo "Invalid GTRows release tag" >&2
              exit 1
            fi
            npm pkg set version="${RELEASE_TAG#v}"
          fi

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Build Electron app (AppImage + RPM + DEB + Pacman + tar.gz)
        run: npm run build:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FPM_DEBUG: 'true'

      - name: List built artifacts
        run: ls -lh dist/

      - name: Verify update manifests and payload checksums
        if: github.event_name != 'workflow_dispatch' || hashFiles('scripts/verify-update-metadata.cjs') != ''
        run: node scripts/verify-update-metadata.cjs dist

      - name: Upload x64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-x64
          path: dist/*x86_64*.AppImage
          if-no-files-found: error

      - name: Upload arm64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-arm64
          path: dist/*arm64*.AppImage
          if-no-files-found: error

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload Pacman packages
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-pacman
          path: dist/*.pacman
          if-no-files-found: error

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-tar
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload Linux update metadata
        if: github.event_name != 'workflow_dispatch' || hashFiles('scripts/verify-update-metadata.cjs') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Widget-linux-update
          path: dist/latest-linux*.yml
          if-no-files-found: error
